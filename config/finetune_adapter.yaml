# training related
seed: 2024
num_workers: 4
ngpu: 1
batch_type: numel
batch_size: 8
batch_bins: 400000
accum_grad: 4

max_epoch: 5
log_interval: 50
keep_nbest_models: 2
use_amp: true
multiple_iterator: false


optim: adamw
optim_conf:
    lr: 0.001 
    weight_decay: 0.01
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 1000 
grad_clip: 5.0
grad_clip_type: 2.0

# Disable specaug for adapter fine-tuning?
specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
      - 0
      - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
      - 0.
      - 0.05
    num_time_mask: 5

# adapter related, E-adapter-like
use_adapter: true
adapter: lora
adapter_conf:
  rank: 16
  alpha: 32
  dropout_rate: 0.05
  target_modules:
    - linear_q      
    - linear_k      
    - linear_v      
    - linear_out    
    - w_1           
    - w_2           
    - ctc_lo        
  bias_type: none
